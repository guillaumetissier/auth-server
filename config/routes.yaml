controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Only the endpoints of the enabled grants (the bundle's route file also declares /device-code).
oauth2_authorize:
    path: /authorize
    methods: [GET]
    controller: ['league.oauth2_server.controller.authorization', 'indexAction']

oauth2_token:
    path: /token
    methods: [POST]
    controller: ['league.oauth2_server.controller.token', 'indexAction']

2fa_login:
    path: /2fa
    defaults:
        _controller: 'scheb_two_factor.form_controller::form'

2fa_login_check:
    path: /2fa_check

# On a version tag (v1.2.3): pushes the server image to GitHub Container Registry, and creates the
# GitHub release with the browser client attached (oauth-dpop.js, oauth-dpop.global.js).
name: Release

on:
  push:
    tags: ['v*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/guillaumetissier/auth-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  browser-client:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
    defaults:
      run:
        working-directory: packages/oauth-dpop-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Create the GitHub release with the client files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." \
            dist/oauth-dpop.js dist/oauth-dpop.global.js src/oauth-dpop.ts \
          || gh release upload "$GITHUB_REF_NAME" dist/oauth-dpop.js dist/oauth-dpop.global.js src/oauth-dpop.ts --clobber

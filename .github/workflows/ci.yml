name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: server (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, sodium, intl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  e2e:
    name: End-to-end (Docker image, MySQL, real HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, sodium, intl, curl
          coverage: none
      # The check script runs on the host and uses resource-guard and otphp from vendor/.
      - run: composer install --no-interaction --no-progress
      - run: make secrets
      - name: Build and start the stack (migrations run at start-up)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: End-to-end scenarios
        run: php tools/e2e.php
        env:
          ISSUER: http://localhost:8080
          CONSOLE: docker compose exec -T auth-server php bin/console
      - name: Server logs
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, sodium, intl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer stan

  coding-standard:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, sodium, intl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer cs

  dpop-client:
    name: oauth-dpop-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dpop-client-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

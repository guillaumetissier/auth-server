# Auth server stack: the PHP application and its own MySQL database, isolated from any other project.
#
#   make secrets   # once: creates .env.docker with random secrets
#   make up        # = docker compose up -d --build
#
# Published port: 8080, or AUTH_SERVER_PORT from the shell (AUTH_SERVER_PORT=8081 make up).
#
# Attaching an application: join the "auth-server" network from its own compose file
# (see README) and call http://auth-server:8080 internally; browsers use APP_ISSUER.

services:
  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: auth-server:latest
    restart: unless-stopped
    # Settings and secrets: .env.docker ("make secrets" creates it) overrides the defaults of .env.
    # No ${...} for settings here: Compose would take them from .env, the Symfony defaults.
    env_file: .env.docker
    ports:
      - "${AUTH_SERVER_PORT:-8080}:8080"
    volumes:
      - auth-keys:/app/var/keys
    # Lets webhooks reach a receiver running on the host (http://host.docker.internal:9000), also on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - auth-internal
      - auth-server

  auth-db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    env_file: .env.docker   # MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    # No published port and only on the internal network: reachable by the auth server alone.
    networks:
      - auth-internal

volumes:
  auth-db-data:
  auth-keys:

networks:
  # Private link between the auth server and its database (no outbound access).
  auth-internal:
    internal: true
  # Shared network other projects join to reach the auth server (JWKS, webhooks).
  auth-server:
    name: auth-server

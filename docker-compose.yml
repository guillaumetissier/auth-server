# Auth server stack: the PHP application and its own MySQL database, isolated from any other project.
#
#   cp .env.example .env && make secrets   # once
#   docker compose up -d --build
#
# Attaching an application: join the "auth-server" network from its own compose file
# (see README) and call http://auth-server:8080 internally; browsers use APP_ISSUER.

services:
  auth-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: auth-server:latest
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET:?run "make secrets" first}
      APP_ISSUER: ${APP_ISSUER:-http://localhost:8080}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_URL: mysql://${MYSQL_USER:-auth}:${MYSQL_PASSWORD:?}@auth-db:3306/${MYSQL_DATABASE:-auth}?serverVersion=8.4.0&charset=utf8mb4
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:?}
      OAUTH_PASSPHRASE: ${OAUTH_PASSPHRASE:-}
      OAUTH_ACCESS_TOKEN_TTL: ${OAUTH_ACCESS_TOKEN_TTL:-PT15M}
      OAUTH_REFRESH_TOKEN_TTL: ${OAUTH_REFRESH_TOKEN_TTL:-P30D}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?}
      TOTP_ISSUER: ${TOTP_ISSUER:-Auth Server}
      APP_2FA_MODE: ${APP_2FA_MODE:-grace}
      APP_2FA_DEADLINE: ${APP_2FA_DEADLINE:-}
      DPOP_REQUIRED_BY_DEFAULT: ${DPOP_REQUIRED_BY_DEFAULT:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      IMPERSONATION_TTL: ${IMPERSONATION_TTL:-PT30M}
      IMPERSONATION_ACCESS_TOKEN_TTL: ${IMPERSONATION_ACCESS_TOKEN_TTL:-PT5M}
      IMPERSONATION_READONLY_SCOPES: ${IMPERSONATION_READONLY_SCOPES:-profile,offline_access}
      ACCESS_DEFAULT_EXPRESSION: ${ACCESS_DEFAULT_EXPRESSION:-}
      WEBHOOK_URLS: ${WEBHOOK_URLS:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    ports:
      - "${AUTH_SERVER_PORT:-8080}:8080"
    volumes:
      - auth-keys:/app/var/keys
    # Lets webhooks reach a receiver running on the host (http://host.docker.internal:9000), also on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - auth-internal
      - auth-server

  auth-db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-auth}
      MYSQL_USER: ${MYSQL_USER:-auth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    # No published port and only on the internal network: reachable by the auth server alone.
    networks:
      - auth-internal

volumes:
  auth-db-data:
  auth-keys:

networks:
  # Private link between the auth server and its database (no outbound access).
  auth-internal:
    internal: true
  # Shared network other projects join to reach the auth server (JWKS, webhooks).
  auth-server:
    name: auth-server
